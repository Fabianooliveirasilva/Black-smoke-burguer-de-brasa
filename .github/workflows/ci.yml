name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://burger:burger_dev_password@localhost:5433/blacksmoke
  TEST_DATABASE_URL: postgresql://burger:burger_dev_password@localhost:5433/blacksmoke_test

jobs:
  quality:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (fail on high/critical in production deps)
        run: pnpm audit --prod --audit-level=high

  integration-e2e:
    name: Integration, build, API & E2E (Chromium, Firefox, WebKit)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: burger
          POSTGRES_PASSWORD: burger_dev_password
          POSTGRES_DB: blacksmoke_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U burger" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
        env: { NEXT_PUBLIC_SITE_URL: "http://localhost:3100" }
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: API + E2E (Playwright, all browser projects)
        run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  lighthouse:
    name: Lighthouse (mobile, production build)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: burger
          POSTGRES_PASSWORD: burger_dev_password
          POSTGRES_DB: blacksmoke
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U burger" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed the catalog
        run: pnpm db:deploy && pnpm db:seed
      - name: Production build
        run: pnpm build
        env: { NEXT_PUBLIC_SITE_URL: "http://localhost:3000" }
      - name: Start the production server
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -base64 48)"
          BETTER_AUTH_URL=http://localhost:3000 NEXT_PUBLIC_SITE_URL=http://localhost:3000 UPLOAD_DIR="$PWD/storage/uploads" \
            NODE_ENV=production PORT=3000 HOSTNAME=localhost nohup node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/menu > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Lighthouse CI (3 runs per page, median)
        run: npx -y @lhci/cli@0.16.0 autorun
      - name: Scores as annotations and job summary
        if: always()
        run: node scripts/lighthouse-summary.mjs

  docker:
    name: Docker Compose stack (build, migrate, seed, smoke test)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Write .env for the stack (throwaway values)
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "SEED_ADMIN_EMAIL=admin@smoke.test"
            echo "SEED_ADMIN_PASSWORD=Smoke#Compose2026"
          } > .env
      - name: docker compose up + smoke test
        run: scripts/compose-smoke.sh
        env:
          SEED_ADMIN_EMAIL: admin@smoke.test
          SEED_ADMIN_PASSWORD: Smoke#Compose2026
      - name: Tear down
        if: always()
        run: docker compose down -v
