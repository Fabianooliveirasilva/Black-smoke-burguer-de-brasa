name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://burger:burger_dev_password@localhost:5433/blacksmoke
  TEST_DATABASE_URL: postgresql://burger:burger_dev_password@localhost:5433/blacksmoke_test

jobs:
  quality:
    name: Lint, types, unit tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (fail on high/critical in production deps)
        run: pnpm audit --prod --audit-level=high

  integration-e2e:
    name: Integration, build, API & E2E
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: burger
          POSTGRES_PASSWORD: burger_dev_password
          POSTGRES_DB: blacksmoke_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U burger" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (real PostgreSQL)
        run: pnpm test:integration
      - name: Production build
        run: pnpm build
        env: { NEXT_PUBLIC_SITE_URL: "http://localhost:3100" }
      - run: pnpm exec playwright install --with-deps chromium
      - name: API + E2E (Playwright)
        run: pnpm test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  docker:
    name: Docker image builds
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., target: runner, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
