# Production-like stack: PostgreSQL + one-shot migrations/seed + app.
# Usage: cp .env.example .env (fill secrets) && docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blacksmoke}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-burger} -d ${POSTGRES_DB:-blacksmoke}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: build, args: { NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}" } }
    command: sh -c "pnpm db:deploy && pnpm db:seed"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-burger}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blacksmoke}
      NODE_ENV: production
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner, args: { NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}" } }
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-burger}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blacksmoke}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
